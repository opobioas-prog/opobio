<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpoTest - Falladas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <header id="appHeader"></header>

  <main class="max-w-2xl mx-auto px-4 pt-4 pb-32 space-y-4">
    <p class="text-[10px] text-gray-300 px-1">Falladas v20260506-11</p>
    <div class="bg-orange-50 dark:bg-orange-900/20 border border-orange-100 dark:border-orange-800 rounded-xl p-4">
      <p class="text-sm text-orange-700 dark:text-orange-300">Preguntas ordenadas de menor a mayor tasa de acierto.</p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 p-3">
      <label for="filtroTema" class="block text-xs text-gray-400 mb-1.5">Tema</label>
      <select id="filtroTema" onchange="setFiltroTema(this.value)"
        class="w-full px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Todos los temas</option>
      </select>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-xs text-gray-400">Top:</span>
      <button onclick="setLimite(20, true)" data-l="20" class="limite-btn px-2.5 py-1 rounded-lg text-xs font-medium">20</button>
      <button onclick="setLimite(50, true)" data-l="50" class="limite-btn px-2.5 py-1 rounded-lg text-xs font-medium">50</button>
      <button onclick="setLimite(100, true)" data-l="100" class="limite-btn px-2.5 py-1 rounded-lg text-xs font-medium">100</button>
      <button onclick="cargar()" class="ml-auto text-xs text-indigo-600 dark:text-indigo-400 font-medium">Recargar</button>
    </div>

    <div id="spinner" class="flex justify-center py-12"><div class="spinner"></div></div>
    <div id="errorBox" class="hidden text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 px-3 py-2.5 rounded-lg"></div>
    <div id="empty" class="hidden text-center py-12 text-gray-400 text-sm">Sin historial aun. Realiza tests primero.</div>

    <div>
      <p id="numFalladas" class="text-xs text-gray-400 px-1 mb-2"></p>
      <div id="listaFalladas" class="space-y-2"></div>
    </div>
  </main>

  <div id="btnWrap" class="hidden fixed bottom-16 left-0 right-0 px-4 py-3 bg-gradient-to-t from-gray-50 dark:from-gray-900 to-transparent pointer-events-none">
    <div class="max-w-2xl mx-auto pointer-events-auto">
      <button id="btnPracticar" onclick="iniciarTestFalladas()"
        class="w-full min-h-[52px] bg-orange-500 hover:bg-orange-600 disabled:opacity-50 text-white font-bold text-base rounded-2xl shadow-lg transition-colors">
        <span id="btnPLabel">Practicar preguntas</span>
        <div id="spinnerBtn" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
      </button>
    </div>
  </div>

  <nav id="bottomNav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./js/config.js?v=20260506-10"></script>
  <script src="./js/auth.js?v=20260506-10"></script>
  <script src="./js/utils.js?v=20260506-11"></script>
  <script src="./js/layout.js?v=20260506-11"></script>
  <script>
    let falladas = []
    let temasFiltro = []
    let filtroTema = ''
    let limite = 20

    ;(async () => {
      try {
        await requireAuth()
        initLayout('falladas', 'Falladas', './dashboard.html?v=20260506-10')
        setLimite(20)
        await cargarTemasFiltro()
        await cargar()
      } catch (e) {
        mostrarError(e.message || 'No se pudieron cargar falladas.')
      }
    })()

    async function cargarTemasFiltro() {
      const { data, error } = await db.from('estadisticas_preguntas')
        .select('codigo_tema,tema,veces_mostrada')
        .gt('veces_mostrada', 0)
      if (error) throw error

      const mapa = new Map()
      ;(data || []).forEach(s => {
        const codigo = s.codigo_tema || ''
        if (!codigo) return
        if (!mapa.has(codigo)) mapa.set(codigo, { codigo, tema: s.tema || '', total: 0 })
        mapa.get(codigo).total++
      })
      temasFiltro = [...mapa.values()].sort((a, b) => a.codigo.localeCompare(b.codigo, 'es', { numeric: true }))

      const select = document.getElementById('filtroTema')
      select.innerHTML = ''
      select.appendChild(new Option('Todos los temas', ''))
      temasFiltro.forEach(t => select.appendChild(new Option(`${t.codigo} - ${t.tema} (${t.total})`, t.codigo)))
      select.value = filtroTema
    }

    function setFiltroTema(codigo) {
      filtroTema = codigo
      cargar()
    }

    async function cargar() {
      document.getElementById('spinner').classList.remove('hidden')
      document.getElementById('listaFalladas').innerHTML = ''
      document.getElementById('btnWrap').classList.add('hidden')
      document.getElementById('errorBox').classList.add('hidden')

      try {
        let query = db.from('estadisticas_preguntas')
          .select('*')
          .gt('veces_mostrada', 0)

        if (filtroTema) query = query.eq('codigo_tema', filtroTema)
        query = query.order('tasa_acierto', { ascending: true }).limit(limite)

        const { data, error } = await query
        if (error) throw error

        falladas = (data || []).map(s => ({
          ...s,
          veces_mostrada: Number(s.veces_mostrada || 0),
          aciertos: Number(s.aciertos || 0),
          fallos: Number(s.fallos || 0),
          tasa_acierto: Number(s.tasa_acierto || 0),
        }))
        renderFalladas()
      } catch (e) {
        mostrarError(e.message || 'Error al cargar datos.')
      } finally {
        document.getElementById('spinner').classList.add('hidden')
      }
    }

    function setLimite(l, recargar = false) {
      limite = l
      document.querySelectorAll('.limite-btn').forEach(b => {
        b.className = `limite-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors ${
          Number(b.dataset.l) === l ? 'bg-indigo-600 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'
        }`
      })
      if (recargar) cargar()
    }

    function renderFalladas() {
      const empty = document.getElementById('empty')
      const lista = document.getElementById('listaFalladas')
      lista.innerHTML = ''
      document.getElementById('numFalladas').textContent = `${falladas.length} preguntas con historial`

      if (!falladas.length) {
        empty.classList.remove('hidden')
        return
      }
      empty.classList.add('hidden')
      document.getElementById('btnWrap').classList.remove('hidden')
      document.getElementById('btnPLabel').textContent = `Practicar estas ${falladas.length} preguntas`
      falladas.forEach((s, i) => lista.appendChild(cardFallada(s, i + 1)))
    }

    function cardFallada(s, rank) {
      const card = document.createElement('div')
      card.className = 'bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 px-4 py-3 flex items-start gap-3'
      card.innerHTML = `
        <div class="w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-xs font-bold bg-gray-100 dark:bg-gray-800 text-gray-500"></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5 mb-1">
            <span class="text-[9px] bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 px-1.5 py-0.5 rounded-full font-medium"></span>
            <span class="text-[10px] text-gray-400 truncate"></span>
          </div>
          <p class="text-sm text-gray-800 dark:text-gray-200 leading-snug mb-2"></p>
          <div class="flex items-center gap-2">
            <div class="progress-track flex-1 h-1.5"><div class="progress-fill bg-red-500"></div></div>
            <span class="text-sm font-bold text-red-500 shrink-0"></span>
          </div>
          <div class="flex gap-3 mt-1.5 text-[10px] text-gray-400">
            <span class="vistas"></span>
            <span class="ok text-green-500 font-medium"></span>
            <span class="ko text-red-400 font-medium"></span>
          </div>
        </div>`
      card.querySelector('.w-8').textContent = rank
      card.querySelector('span:first-child').textContent = s.codigo_tema || ''
      card.querySelector('span:nth-child(2)').textContent = s.tema || ''
      card.querySelector('p').textContent = s.pregunta || ''
      card.querySelector('.progress-fill').style.width = `${s.tasa_acierto}%`
      card.querySelector('.text-sm.font-bold').textContent = `${s.tasa_acierto}%`
      card.querySelector('.vistas').textContent = `Vistas ${s.veces_mostrada}`
      card.querySelector('.ok').textContent = `OK ${s.aciertos}`
      card.querySelector('.ko').textContent = `KO ${s.fallos}`
      return card
    }

    async function iniciarTestFalladas() {
      if (!falladas.length) return
      document.getElementById('btnPracticar').disabled = true
      document.getElementById('spinnerBtn').classList.remove('hidden')

      try {
        const ids = falladas.map(f => f.pregunta_id)
        const { data: preguntas, error } = await db.from('preguntas')
          .select('*')
          .in('id', ids)
          .eq('activa', true)
          .eq('eliminada', false)
        if (error) throw error
        if (!preguntas?.length) throw new Error('No hay preguntas disponibles.')

        const tasaMap = Object.fromEntries(falladas.map(f => [f.pregunta_id, f.tasa_acierto]))
        preguntas.sort((a, b) => (tasaMap[a.id] ?? 100) - (tasaMap[b.id] ?? 100))

        const temasIds = [...new Set(preguntas.map(p => p.tema_id).filter(Boolean))]
        const { data: intento, error: e2 } = await db.from('intentos_test')
          .insert({ temas_ids: temasIds, completado: false })
          .select()
          .single()
        if (e2) throw e2

        guardarSesion({ intentoId: intento.id, preguntas, currentIndex: 0, respuestas: {}, startedAt: new Date().toISOString() })
        window.location.href = `./test-activo.html?v=20260510-1&id=${intento.id}`
      } catch (e) {
        mostrarError(e.message || 'Error al iniciar test.')
        document.getElementById('btnPracticar').disabled = false
        document.getElementById('spinnerBtn').classList.add('hidden')
      }
    }

    function mostrarError(msg) {
      document.getElementById('spinner').classList.add('hidden')
      const box = document.getElementById('errorBox')
      box.textContent = msg
      box.classList.remove('hidden')
    }
  </script>
</body>
</html>
