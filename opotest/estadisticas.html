<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpoTest - Estadisticas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <header id="appHeader"></header>

  <main class="max-w-2xl mx-auto px-4 pt-4 pb-24 space-y-4">
    <p class="text-[10px] text-gray-300 px-1">Stats v20260506-10</p>
    <div id="resumenGlobal" class="grid grid-cols-3 gap-2"></div>

    <div class="flex items-center gap-2 flex-wrap">
      <span class="text-xs text-gray-400">Ordenar:</span>
      <button onclick="setOrden('tasa_asc')" data-o="tasa_asc" class="orden-btn px-2.5 py-1 rounded-lg text-xs font-medium">Mas falladas</button>
      <button onclick="setOrden('tasa_desc')" data-o="tasa_desc" class="orden-btn px-2.5 py-1 rounded-lg text-xs font-medium">Mas acertadas</button>
      <button onclick="setOrden('vistas')" data-o="vistas" class="orden-btn px-2.5 py-1 rounded-lg text-xs font-medium">Mas vistas</button>
    </div>

    <div id="spinner" class="flex justify-center py-12"><div class="spinner"></div></div>
    <div id="errorBox" class="hidden text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 px-3 py-2.5 rounded-lg"></div>
    <div id="empty" class="hidden text-center py-12 text-gray-400 text-sm">Sin datos aun. Realiza tests para ver estadisticas.</div>

    <div>
      <p id="numStats" class="text-xs text-gray-400 px-1 mb-2"></p>
      <div id="listaStats" class="space-y-2"></div>
    </div>
  </main>

  <nav id="bottomNav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/utils.js?v=20260506-10"></script>
  <script src="./js/layout.js?v=20260506-10"></script>
  <script>
    let statsData = []
    let ordenActivo = 'tasa_asc'

    ;(async () => {
      try {
        await requireAuth()
        initLayout('estadisticas', 'Estadisticas', './dashboard.html?v=20260506-10')
        setOrden('tasa_asc')
        await cargarResumen()
        await cargarStats()
      } catch (e) {
        mostrarError(e.message || 'No se pudieron cargar estadisticas.')
      }
    })()

    async function cargarResumen() {
      const [{ count: total, error: e1 }, { count: elim, error: e2 }, { data: intentos, error: e3 }] = await Promise.all([
        db.from('preguntas').select('*', { count: 'exact', head: true }).eq('activa', true),
        db.from('preguntas').select('*', { count: 'exact', head: true }).eq('eliminada', true).eq('activa', true),
        db.from('intentos_test').select('aciertos,total_validas').eq('completado', true),
      ])
      if (e1) throw e1
      if (e2) throw e2
      if (e3) throw e3

      const respondidas = (intentos || []).reduce((s, i) => s + (i.total_validas || 0), 0)
      const aciertos = (intentos || []).reduce((s, i) => s + (i.aciertos || 0), 0)
      const media = respondidas > 0 ? Math.round(aciertos / respondidas * 100) : 0

      const box = document.getElementById('resumenGlobal')
      box.innerHTML = ''
      box.appendChild(miniCard('Preguntas', total || 0, 'text-indigo-600 dark:text-indigo-400'))
      box.appendChild(miniCard('Tests', intentos?.length || 0, 'text-indigo-600 dark:text-indigo-400'))
      box.appendChild(miniCard('Media', `${media}%`, colorPct(media)))
    }

    async function cargarStats() {
      document.getElementById('spinner').classList.remove('hidden')
      const { data, error } = await db.from('estadisticas_preguntas').select('*')
      if (error) throw error
      statsData = (data || [])
        .filter(s => Number(s.veces_mostrada) > 0)
        .map(s => ({
          ...s,
          veces_mostrada: Number(s.veces_mostrada || 0),
          aciertos: Number(s.aciertos || 0),
          fallos: Number(s.fallos || 0),
          eliminaciones: Number(s.eliminaciones || 0),
          tasa_acierto: Number(s.tasa_acierto || 0),
        }))
      document.getElementById('spinner').classList.add('hidden')
      renderStats()
    }

    function setOrden(o) {
      ordenActivo = o
      document.querySelectorAll('.orden-btn').forEach(b => {
        b.className = `orden-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors ${
          b.dataset.o === o ? 'bg-indigo-600 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'
        }`
      })
      renderStats()
    }

    function renderStats() {
      const lista = document.getElementById('listaStats')
      const empty = document.getElementById('empty')
      lista.innerHTML = ''

      let datos = [...statsData].sort((a, b) => {
        if (ordenActivo === 'tasa_asc') return a.tasa_acierto - b.tasa_acierto
        if (ordenActivo === 'tasa_desc') return b.tasa_acierto - a.tasa_acierto
        return b.veces_mostrada - a.veces_mostrada
      })

      document.getElementById('numStats').textContent = `${datos.length} preguntas con historial`
      if (!datos.length) {
        empty.classList.remove('hidden')
        return
      }
      empty.classList.add('hidden')
      datos.forEach(s => lista.appendChild(cardStat(s)))
    }

    function cardStat(s) {
      const card = document.createElement('div')
      card.className = 'bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 overflow-hidden'
      const id = `st_${s.pregunta_id}`
      card.innerHTML = `
        <button class="w-full flex items-start gap-3 px-4 py-3 text-left">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="text-[9px] bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 px-1.5 py-0.5 rounded-full font-medium"></span>
              <span class="text-[10px] text-gray-400 truncate"></span>
            </div>
            <p class="text-sm text-gray-800 dark:text-gray-200 leading-snug"></p>
            <div class="flex items-center gap-2 mt-2">
              <div class="progress-track flex-1"><div class="progress-fill bg-indigo-500"></div></div>
              <span class="text-sm font-bold min-w-[38px] text-right"></span>
            </div>
          </div>
        </button>
        <div id="${id}" class="hidden border-t border-gray-50 dark:border-gray-700 px-4 pb-3 pt-2">
          <div class="grid grid-cols-4 gap-1 text-center"></div>
        </div>`
      card.querySelector('button').addEventListener('click', () => document.getElementById(id).classList.toggle('hidden'))
      card.querySelector('span:first-child').textContent = s.codigo_tema || ''
      card.querySelector('span:nth-child(2)').textContent = s.tema || ''
      card.querySelector('p').textContent = s.pregunta || ''
      card.querySelector('.progress-fill').style.width = `${s.tasa_acierto}%`
      card.querySelector('.font-bold.min-w-\\[38px\\]').textContent = `${s.tasa_acierto}%`
      const grid = card.querySelector('.grid')
      grid.appendChild(miniCell('Vistas', s.veces_mostrada))
      grid.appendChild(miniCell('Aciertos', s.aciertos, 'text-green-600'))
      grid.appendChild(miniCell('Fallos', s.fallos, 'text-red-500'))
      grid.appendChild(miniCell('Omitidas', s.eliminaciones, 'text-gray-400'))
      return card
    }

    function miniCard(label, val, color) {
      const div = document.createElement('div')
      div.className = 'bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 p-3 text-center'
      div.innerHTML = `<p class="text-xl font-bold ${color}"></p><p class="text-[10px] text-gray-400"></p>`
      div.querySelector('p:first-child').textContent = val
      div.querySelector('p:last-child').textContent = label
      return div
    }

    function miniCell(label, val, color = 'text-gray-700 dark:text-gray-300') {
      const div = document.createElement('div')
      div.className = 'bg-gray-50 dark:bg-gray-800/50 rounded-lg py-1.5'
      div.innerHTML = `<p class="text-base font-bold ${color}"></p><p class="text-[9px] text-gray-400"></p>`
      div.querySelector('p:first-child').textContent = val
      div.querySelector('p:last-child').textContent = label
      return div
    }

    function mostrarError(msg) {
      document.getElementById('spinner').classList.add('hidden')
      const box = document.getElementById('errorBox')
      box.textContent = msg
      box.classList.remove('hidden')
    }
  </script>
</body>
</html>
